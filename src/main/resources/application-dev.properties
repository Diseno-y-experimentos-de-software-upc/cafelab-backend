# Spring DataSource Configuration (sobrescribe con DB_* / JWT_SECRET en tu entorno si aplica)
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:cafe}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
server.port=${SERVER_PORT:8080}

# JWT (solo desarrollo local; en producción define JWT_SECRET explícito)
authorization.jwt.secret=${JWT_SECRET:local-dev-only-change-me-0123456789abcdef0123456789abcdef}