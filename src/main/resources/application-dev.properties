# MySQL local por defecto (sobrescribir con DB_* / JWT_SECRET en .env o variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cafe}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
authorization.jwt.secret=${JWT_SECRET:cafe-lab-local-dev-jwt-secret-min-32-chars-do-not-use-in-prod}