# Valores por defecto para desarrollo local (sobreescribir con .env si tu MySQL es distinto)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cafe}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

authorization.jwt.secret=${JWT_SECRET:dev-secret-key-0123456789abcdef0123456789abcdef}